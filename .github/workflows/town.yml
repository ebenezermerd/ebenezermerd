# Redraws the town every Monday from the live list of public repos, and
# whenever the drawing script or its fonts change.
name: redraw the town

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "package.json"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # only the pictures change here, so this push never sets the workflow off again
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "chore: redraw the town from the latest repos" && git push; }
